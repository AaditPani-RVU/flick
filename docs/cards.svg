<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Three kinds of card as they land on the Mac: a bare photo, a file on a paper card, and copied text on a paper card">
  <defs>
    <radialGradient id="floor" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#4A1E0C"/>
      <stop offset="0.5" stop-color="#1A120E"/>
      <stop offset="1" stop-color="#100D0B"/>
    </radialGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="0.55" stop-color="#E8795A"/>
      <stop offset="1" stop-color="#FFC27A"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#floor)"/>

  <!-- Photo: shown bare -->
  <g transform="translate(220,178) rotate(-4)" filter="url(#drop)">
    <rect x="-98" y="-124" width="196" height="248" rx="16" fill="url(#sky2)"/>
    <circle cx="30" cy="-14" r="32" fill="#FFE2A8"/>
    <path d="M-98,54 L-36,-8 L10,42 L46,12 L98,62 L98,108 a16,16 0 0 1 -16,16 L-82,124 a16,16 0 0 1 -16,-16 Z" fill="#1B1420"/>
    <rect x="-98" y="-124" width="196" height="248" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"/>
  </g>

  <!-- File: paper card with icon and name -->
  <g transform="translate(600,178) rotate(3)" filter="url(#drop)">
    <rect x="-110" y="-124" width="220" height="248" rx="7" fill="#FFF8EC"/>
    <rect x="-99" y="-113" width="198" height="190" rx="3" fill="#F1E7D8"/>
    <path d="M-34,-70 h44 l24,24 v78 a6,6 0 0 1 -6,6 h-62 a6,6 0 0 1 -6,-6 v-96 a6,6 0 0 1 6,-6 z" fill="#FFFFFF" stroke="#2A2420" stroke-opacity="0.2"/>
    <path d="M10,-70 v18 a6,6 0 0 0 6,6 h18 z" fill="#E4D8C6"/>
    <rect x="-22" y="-26" width="44" height="5" rx="2.5" fill="#2A2420" fill-opacity="0.35"/>
    <rect x="-22" y="-12" width="44" height="5" rx="2.5" fill="#2A2420" fill-opacity="0.35"/>
    <rect x="-22" y="2" width="28" height="5" rx="2.5" fill="#2A2420" fill-opacity="0.35"/>
    <text x="-97" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2A2420">Lease agreement.pdf</text>
  </g>

  <!-- Text: paper card with a margin rule -->
  <g transform="translate(980,178) rotate(-2)" filter="url(#drop)">
    <rect x="-125" y="-124" width="250" height="248" rx="7" fill="#FFF8EC"/>
    <rect x="-114" y="-113" width="228" height="190" rx="3" fill="#F1E7D8"/>
    <rect x="-114" y="-113" width="3" height="190" fill="#FF5A2A"/>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2A2420">
      <text x="-94" y="-76">Gate code is 4471,</text>
      <text x="-94" y="-52">second door on the</text>
      <text x="-94" y="-28">left after the lift.</text>
    </g>
    <text x="-112" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2A2420">On your clipboard</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6" fill="#FFF6E9" fill-opacity="0.7" text-anchor="middle">
    <text x="220" y="372">PHOTO</text>
    <text x="600" y="372">FILE</text>
    <text x="980" y="372">COPIED TEXT</text>
  </g>
</svg>
