<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A phone on the left flicks a photo along an arc onto a Mac screen on the right">
  <defs>
    <radialGradient id="room" cx="78%" cy="18%" r="80%">
      <stop offset="0" stop-color="#3A1A0C"/>
      <stop offset="0.55" stop-color="#17100C"/>
      <stop offset="1" stop-color="#100D0B"/>
    </radialGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#FF5A2A" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FF5A2A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF5A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FF5A2A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF5A2A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="0.55" stop-color="#E8795A"/>
      <stop offset="1" stop-color="#FFC27A"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241A16"/>
      <stop offset="1" stop-color="#15100D"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="712" y="96" width="380" height="244" rx="6"/></clipPath>
    <clipPath id="phoneClip"><rect x="118" y="92" width="196" height="376" rx="26"/></clipPath>
    <!-- One photo, reused wherever a print appears -->
    <g id="photo">
      <rect x="-60" y="-78" width="120" height="156" rx="12" fill="url(#sky)"/>
      <circle cx="18" cy="-8" r="20" fill="#FFE2A8"/>
      <path d="M-60,34 L-22,-4 L6,26 L28,8 L60,40 L60,66 a12,12 0 0 1 -12,12 L-48,78 a12,12 0 0 1 -12,-12 Z" fill="#1B1420"/>
      <rect x="-60" y="-78" width="120" height="156" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"/>
    </g>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#room)"/>

  <!-- Phone -->
  <rect x="108" y="82" width="216" height="396" rx="34" fill="#0A0807" stroke="#3A2E28" stroke-width="2"/>
  <g clip-path="url(#phoneClip)">
    <rect x="118" y="92" width="196" height="376" fill="#100D0B"/>
    <rect x="118" y="92" width="196" height="260" fill="url(#phoneGlow)"/>
    <text x="216" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#FFF6E9" fill-opacity="0.9">↑  YOUR MAC</text>
    <!-- The card has just left: a faint outline remains -->
    <rect x="160" y="200" width="112" height="146" rx="12" fill="none" stroke="#FFF6E9" stroke-opacity="0.22" stroke-dasharray="5 6" transform="rotate(-3 216 273)"/>
    <text x="216" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#FFF6E9" fill-opacity="0.7">Flick your wrist toward the Mac</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#FFF6E9" text-anchor="middle">
      <rect x="130" y="420" width="54" height="28" rx="14" fill="#FFF6E9" fill-opacity="0.08" stroke="#FFF6E9" stroke-opacity="0.25"/>
      <text x="157" y="438">PHOTOS</text>
      <rect x="189" y="420" width="54" height="28" rx="14" fill="#FFF6E9" fill-opacity="0.08" stroke="#FFF6E9" stroke-opacity="0.25"/>
      <text x="216" y="438">FILES</text>
      <rect x="248" y="420" width="54" height="28" rx="14" fill="#FFF6E9" fill-opacity="0.08" stroke="#FFF6E9" stroke-opacity="0.25"/>
      <text x="275" y="438">PASTE</text>
    </g>
  </g>

  <!-- Flight path with fading echoes of the photo -->
  <path d="M250,230 C380,40 600,20 800,190" fill="none" stroke="#FF5A2A" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round"/>
  <use href="#photo" transform="translate(300,170) rotate(-24) scale(0.62)" opacity="0.2"/>
  <use href="#photo" transform="translate(420,96) rotate(-10) scale(0.66)" opacity="0.38"/>
  <use href="#photo" transform="translate(560,78) rotate(6) scale(0.7)" opacity="0.6"/>

  <!-- Mac -->
  <rect x="700" y="84" width="404" height="268" rx="14" fill="#0A0807" stroke="#3A2E28" stroke-width="2"/>
  <g clip-path="url(#screenClip)">
    <rect x="712" y="96" width="380" height="244" fill="url(#desk)"/>
    <rect x="712" y="96" width="380" height="14" fill="#000000" fill-opacity="0.35"/>
    <path d="M1070,100 l8,3 -8,3 2,-3 z" fill="#FFF6E9" fill-opacity="0.85"/>
    <rect x="712" y="150" width="380" height="190" fill="url(#bloom)"/>
    <ellipse cx="878" cy="318" rx="70" ry="10" fill="#000000" fill-opacity="0.45"/>
    <use href="#photo" transform="translate(872,214) rotate(5) scale(0.92)"/>
  </g>
  <path d="M664,352 h476 l-14,20 a10,10 0 0 1 -8,4 h-432 a10,10 0 0 1 -8,-4 z" fill="#1C1512" stroke="#3A2E28" stroke-width="2"/>
  <rect x="862" y="352" width="80" height="6" rx="3" fill="#0A0807"/>

  <!-- Caption -->
  <text x="664" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#FFF6E9">Flick it. It lands.</text>
  <text x="664" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#FFF6E9" fill-opacity="0.65">PHOTOS · FILES · COPIED TEXT · OVER YOUR WI‑FI</text>
</svg>
